# Self-hostable single-tenant deployment: the whole platform for one customer.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  control-plane:
    build: ../control-plane
    environment:
      PGHOST: postgres
      API_PORT: 3000
    depends_on:
      - postgres

volumes:
  pgdata: {}
